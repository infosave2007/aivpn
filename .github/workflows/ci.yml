name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    # aivpn-windows cannot build on the ubuntu runner (Windows-only APIs);
    # every other workspace crate — including aivpn-linux, which the old
    # default-members build never covered — is built, tested and linted.
    - name: Build
      run: cargo build --workspace --exclude aivpn-windows --verbose

    - name: Build release server (all production features)
      run: cargo build --locked --release -p aivpn-server --features "management-api,metrics,neural"

    - name: Read workspace version
      id: workspace-version
      run: |
        version="$(awk -F'"' '/^\[workspace\.package\]/{found=1; next} found && /^version = /{print $2; exit}' Cargo.toml)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Upload release server
      uses: actions/upload-artifact@v4
      with:
        name: aivpn-server-linux-x86_64-${{ steps.workspace-version.outputs.version }}
        path: target/release/aivpn-server
        if-no-files-found: error
        retention-days: 7

    - name: Kernel policy tests
      run: |
        cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined platforms/linux-kernel/tests/policy_test.c -o /tmp/aivpn-policy-test
        /tmp/aivpn-policy-test
        python3 deploy/ci/test-kernel-rx.py
        python3 deploy/ci/test-kernel-owner.py

    - name: BPF and packaging regressions
      run: |
        sudo apt-get update
        sudo apt-get install -y libbpf-dev clang
        cc -std=gnu11 -Wall -Wextra -Werror -Wno-unknown-pragmas -pthread -fsanitize=undefined platforms/linux-kernel/tests/bpf_policy_test.c -o /tmp/aivpn-bpf-test
        /tmp/aivpn-bpf-test
        clang -O2 -target bpf -g -Wall -Werror -I/usr/include/x86_64-linux-gnu -c deploy/ebpf/tc_qos_prog.c -o /tmp/aivpn-tc.o
        clang -O2 -target bpf -g -Wall -Werror -I/usr/include/x86_64-linux-gnu -c platforms/linux-kernel/src/xdp_prog.c -o /tmp/aivpn-xdp.o
        python3 deploy/ci/test-tc-loader.py
        python3 deploy/ci/test-build-packaging.py
        python3 deploy/ci/test-mikrotik-entrypoint.py

    - name: Run tests
      run: cargo test --locked --workspace --exclude aivpn-windows --features "aivpn-server/management-api,aivpn-server/metrics,aivpn-server/dns,aivpn-server/passive-distribution" --verbose

    - name: Protected build tests
      run: cargo test --locked -p aivpn-server -p aivpn-client -p aivpn-common --features "aivpn-server/production-secure,aivpn-server/management-api,aivpn-server/passive-distribution,aivpn-client/production-secure,aivpn-common/production-secure" --lib

    - name: Clippy correctness and suspicious checks
      run: cargo clippy --locked --workspace --all-targets --exclude aivpn-windows -- -D clippy::correctness -D clippy::suspicious

    - name: Install DPI build dependencies
      run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libpcap-dev libjson-c-dev

    - name: Set DPI tool paths
      run: |
        echo "AIVPN_NDPI_DIR=$RUNNER_TEMP/aivpn-ndpi" >> "$GITHUB_ENV"
        echo "NDPI_READER=$RUNNER_TEMP/aivpn-ndpi/example/ndpiReader" >> "$GITHUB_ENV"

    - name: DPI checkout recovery tests
      run: python3 deploy/ci/test-dpi-checkout.py

    - name: Build pinned DPI classifier
      run: deploy/ci/build-dpi-tools.sh

    - name: Mask DPI gate
      run: make mask-gate

    # Проверяет границу публичного дерева и служебные файлы.
    - name: Public-tree vocabulary gate
      run: make hygiene-gate

    - name: Release version consistency
      run: make version-gate

    # A path dependency reaching outside the repository is a hard Cargo error
    # for everyone who just cloned it, and invisible to whoever added it — their
    # working copy has the sibling directory.
    - name: Mask installer integrity tests
      run: python3 deploy/ci/test-install-masks.py

    - name: Self-contained public tree
      run: make selfcontained

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        key: cargo-audit

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: cargo audit
      run: cargo audit

  windows-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust (Windows GNU target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-gnu

    - name: Install Windows resource compiler
      run: sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64

    - name: Check Windows client
      run: cargo check --locked -p aivpn-client --features ssh-install --target x86_64-pc-windows-gnu

  ios-swift:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust (iOS target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios

    - name: Cache Rust (iOS)
      uses: Swatinem/rust-cache@v2
      with:
        key: ios

    - name: Build iOS Rust core
      run: |
        cargo build --release --target aarch64-apple-ios -p aivpn-ios-core
        mkdir -p crates/aivpn-ios-core/lib
        cp target/aarch64-apple-ios/release/libaivpn_core.a \
           crates/aivpn-ios-core/lib/libaivpn_core.a

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Helper certificate failure tests
      run: python3 deploy/ci/test-helper-certificate.py

    - name: macOS client path tests
      run: python3 deploy/ci/test-macos-client-paths.py

    - name: Device identity failure tests
      run: swift test --package-path platforms/ios

    - name: Generate Xcode project
      run: cd platforms/ios && xcodegen generate

    - name: Build (Swift compilation)
      run: |
        cd platforms/ios
        xcodebuild build \
          -project Aivpn.xcodeproj \
          -scheme Aivpn \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: aivpn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: platforms/aivpn-web
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile
    - run: bun run check
    - run: bun test server/tests
    - run: bun test server/tests
      env:
        AIVPN_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/aivpn_test
    - run: bun run build
