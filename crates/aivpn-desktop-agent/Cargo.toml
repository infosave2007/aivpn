[package]
name = "aivpn-desktop-agent"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local desktop routing service and client transport"

[features]
cli = ["dep:clap", "local-profile", "routing-control", "windows-kernel"]
routing-control = []
windows-kernel = ["routing-control", "windows-sys/Win32_NetworkManagement_WindowsFilteringPlatform", "windows-sys/Win32_NetworkManagement_IpHelper", "windows-sys/Win32_NetworkManagement_Ndis", "windows-sys/Win32_Networking_WinSock"]
local-profile = ["dep:aivpn-common", "dep:tokio", "aivpn-common/transport"]
windows-lab = []
linux-kernel = ["dep:libbpf-sys", "dep:cc", "dep:zbus", "dep:futures-core", "local-profile", "routing-control"]

[build-dependencies]
cc = { version = "1.4", optional = true }

[dependencies]
aivpn-desktop-policy = { path = "../aivpn-desktop-policy" }
aivpn-common = { path = "../aivpn-common", optional = true }
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
base64 = "0.22"
clap = { version = "4.4", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-sys = { version = "1.7.1", optional = true }
libc = "0.2"
sha2.workspace = true
zbus = { version = "=5.18.0", optional = true }
futures-core = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sha2.workspace = true
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_InstallableFileSystems", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Rpc", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Com", "Win32_UI_Shell"] }

[[example]]
name = "linux_vertical_product"
path = "examples/linux_vertical_product.rs"
required-features = ["linux-kernel"]
