[package]
name = "aivpn-client"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "aivpn-client"
path = "src/main.rs"
required-features = ["cli-runtime"]

[[example]]
name = "linux_vertical_service"
path = "examples/linux_vertical_service.rs"
required-features = ["desktop-worker"]

[[example]]
name = "linux_dns_vertical_service"
path = "examples/linux_dns_vertical_service.rs"
required-features = ["desktop-service"]

[[example]]
name = "windows_vertical_service"
path = "examples/windows_vertical_service.rs"
required-features = ["desktop-worker"]


[features]
default = ["cli-runtime"]
app-routing = ["desktop-service", "aivpn-desktop-agent/cli"]
cli-runtime = ["tokio/signal"]
desktop-worker-lab = ["desktop-worker", "aivpn-desktop-agent/windows-lab"]
desktop-worker = ["aivpn-desktop-agent/local-profile", "aivpn-desktop-agent/windows-kernel"]
desktop-service = ["desktop-worker", "aivpn-desktop-agent/linux-kernel", "aivpn-desktop-agent/windows-kernel", "aivpn-desktop-agent/cli"]
# Production secure mode: disables built-in bootstrap fallback
# When enabled, client will fail to start if no valid descriptors are available
production-secure = ["aivpn-common/production-secure"]
# R2 Phase D — client-side inline ML-DPI "reads-as-tunnel" self-gate (OFF by
# default). Samples the client's own outbound wire and requests a mask rotation
# (via the existing MaskPreference path) when its flow reads as a tunnel.
client-dpi-gate = ["aivpn-common/client-dpi-gate"]
# Wave C2a/C2b — pure-Rust SSH client (+ embedded installer bundle,
# high-level orchestration) for the in-app server installer, hoisted into
# aivpn-common so the mobile FFI cores can use it too. OFF by default: pulls
# in `russh`/`russh-sftp` via aivpn-common, which must NOT bloat the default
# aivpn-client build or the mobile FFI cores (aivpn-android-core /
# aivpn-ios-core), neither of which enables this feature.
ssh-install = ["aivpn-common/ssh-install"]

[dependencies]
aivpn-common = { path = "../aivpn-common", version = "*", features = ["client-upload", "qr"] }

# Crypto
blake3.workspace = true
ed25519-dalek = "2.0"

# Async
tokio.workspace = true

# Networking - use latest tun with async support
tun = { version = "0.7", features = ["async"] }
socket2.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true

# Utils
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
clap = { version = "4.4", features = ["derive", "env"] }
base64 = "0.22"
portable-atomic = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Userspace TCP/IP stack for proxy mode (--proxy-listen)
smoltcp = { version = "0.11", default-features = false, features = ["socket-dns", "dns-max-server-count-4", "alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aivpn-desktop-agent = { path = "../aivpn-desktop-agent" }

[target.'cfg(windows)'.dependencies]
aivpn-desktop-agent = { path = "../aivpn-desktop-agent" }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_EventLog", "Win32_System_Console", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "securitybaseapi",
    "handleapi",
    "winnt",
] }

[dev-dependencies]
aivpn-desktop-policy = { path = "../aivpn-desktop-policy" }
async-trait.workspace = true
# `test-util` is not part of the workspace `tokio` "full" feature set — needed
# by client.rs tests that pause/advance virtual time (e.g. to deterministically
# exercise the randomized MaskFeedback send-jitter without a real 0-3s sleep).
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
cc = "1"
