services:
  # AIVPN Server
  aivpn-server:
    image: aivpn-server:latest
    build:
      context: .
      dockerfile: ${AIVPN_SERVER_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    # host networking is required: the server needs to see real client source
    # ports/addresses for the UDP data plane and NAT/MASQUERADE setup, which
    # a bridge network's NAT layer would hide or break. This is the accepted
    # trade-off for a VPN gateway; capabilities below are minimized instead.
    network_mode: "host"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN only: TUN device management + policy routing. NET_RAW was
      # dropped — no code path in this repo opens a raw/packet socket.
      - NET_ADMIN
    security_opt:
      - "no-new-privileges:true"
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      # Single-process root container (see Dockerfile) — no other local user
      # needs access, so /run and /tmp are 0700 rather than the world-writable
      # sticky-bit default (1777).
      - /run:mode=0700,size=64M
      - /tmp:mode=0700,size=128M
    mem_limit: 800m
    memswap_limit: 800m
    cpu_shares: 512
    environment:
      - RUST_LOG=aivpn_server=info,aivpn_common=info,warn
      - RUST_BACKTRACE=1
    volumes:
      - ./deploy/config:/etc/aivpn
      - ./masks:/var/lib/aivpn/masks
      # Management API socket (management-api feature → /run/aivpn/api.sock).
      # /run is a tmpfs above, so the socket must be bind-mounted separately
      # or the web panel on the host cannot attach to it.
      - /run/aivpn:/run/aivpn
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.aivpn.service=gateway"
      - "com.aivpn.version=1.0.0"

# Prometheus/Grafana (optional monitoring) live in a SEPARATE compose file —
# deploy/monitoring/docker-compose.monitoring.yml — not here. Reason: Docker
# Compose validates ${VAR:?required} interpolation for every service at
# parse time, regardless of `profiles:`/`--profile` filtering. Grafana's
# admin password is required-with-no-default (see that file), so keeping it
# in *this* file would make `docker compose config`/`up` fail for ANY
# invocation — including a plain `aivpn-server`-only deploy — unless the
# operator also set a Grafana password they may never use. Splitting the
# file scopes that requirement to only the operators who opt into
# monitoring:
#   docker compose -f docker-compose.yml \
#     -f deploy/monitoring/docker-compose.monitoring.yml \
#     --profile monitoring up -d
